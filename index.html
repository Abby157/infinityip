<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="Unlimited Connections, Infinite Possibilities" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Infinity IP" />

    <!-- Open Graph -->
    <meta property="og:title" content="Infinity IP" />
    <meta property="og:description" content="Unlimited Connections, Infinite Possibilities" />
    <meta property="og:type" content="website" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>Infinity IP</title>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #080810;
        color: #fff;
        font-family: 'Inter', 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }
      #root { min-height: 100vh; }

      /* iOS safe area */
      #root {
        padding-top: env(safe-area-inset-top);
      }

      /* Splash screen */
      #splash {
        position: fixed; inset: 0;
        background: #080810;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999; gap: 16px;
        transition: opacity 0.4s ease;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash-logo {
        font-size: 28px; font-weight: 900;
        letter-spacing: -1px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }
      #splash-sub {
        color: #374151; font-size: 12px;
      }
      #splash-spinner {
        width: 28px; height: 28px;
        border: 2px solid #ffffff10;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>

    <!-- Splash screen -->
    <div id="splash">
      <div id="splash-logo">INFINITY IP</div>
      <div id="splash-sub">Unlimited Connections</div>
      <div id="splash-spinner"></div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <!-- Register service worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered'))
            .catch(err => console.log('SW error:', err))
        })
      }

      // Hide splash when app loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash')
          if (splash) {
            splash.classList.add('hidden')
            setTimeout(() => splash.remove(), 400)
          }
        }, 1200)
      })
    </script>
  </body>
</html>
